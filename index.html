<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
   name="description"
   content="JS UI Lab: interactive UI components in vanilla JavaScript — accordion, tabs, modal and more." />
  <link
   rel="icon"
   type="image/png"
   href="/favicon/favicon-96x96.png"
   sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/favicon/favicon.ico" />
  <link
   rel="apple-touch-icon"
   sizes="180x180"
   href="/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="/favicon/site.webmanifest" />
  <title>JS UI Lab</title>
 </head>
 <body id="top">
  <header class="header">
   <div class="header__container">
    <a class="header__logo" href="#top">JS UI Lab</a>
    <a
     class="header__link"
     href="https://github.com/WebDeveloper-OlehRozhanskyi/js-ui-lab"
     target="_blank"
     rel="noopener">
     GitHub
     <span class="visually-hidden">(opens in a new tab)</span>
    </a>
   </div>
  </header>
  <main class="main">
   <section class="intro">
    <div class="intro__container">
     <h1 class="intro__title">JS UI Lab</h1>
     <p class="intro__description">
      Interactive UI components built with vanilla JavaScript — no frameworks or
      libraries. Each one is accessible, keyboard-friendly and ready to reuse.
     </p>
    </div>
   </section>
   <section class="showcase" aria-labelledby="showcase-title">
    <div class="showcase__container">
     <h2 class="showcase__title section-title" id="showcase-title">
      Components
     </h2>
     <div class="tabs" data-tabs data-tabs-hash>
      <div class="tabs__list" role="tablist">
       <button
        class="tabs__list-button"
        role="tab"
        id="tab-accordion"
        type="button"
        aria-controls="panel-accordion"
        aria-selected="true"
        data-tabs-button
        tabindex="0">
        Accordion
       </button>
       <button
        class="tabs__list-button"
        role="tab"
        id="tab-modal"
        type="button"
        aria-controls="panel-modal"
        aria-selected="false"
        data-tabs-button
        tabindex="-1">
        Modal
       </button>
      </div>
      <div
       class="tabs__panel"
       role="tabpanel"
       id="panel-accordion"
       aria-labelledby="tab-accordion"
       data-tabs-panel
       tabindex="0">
       <h3>accordion</h3>
      </div>
      <div
       class="tabs__panel"
       role="tabpanel"
       id="panel-modal"
       aria-labelledby="tab-modal"
       data-tabs-panel
       tabindex="0"
       hidden>
       <h3>modal</h3>
      </div>
     </div>
    </div>
   </section>
  </main>
  <footer class="footer">
   <div class="footer__container">
    <p class="footer__text">© 2026 Oleh Rozhanskyi</p>
   </div>
  </footer>
  <script type="module" src="./src/main.js"></script>
 </body>
</html>
